
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats | Menu Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CampusEats</h1>
        <p>Fresh Food. Fast Service. Happy Campus.</p>
    </header>

    <main>

        <section class="hero">
            <h2>Our Menu Catalogue</h2>
            <p>Explore delicious food available on campus.</p>
        </section>

        <section class="menu-section">
            <h2>Available Menu Items</h2>

            <div id="menuList" class="menu-grid">
                Loading menu...
            </div>
        </section>

        <section class="form-section">
            <h2>Add a New Menu Item</h2>

            <form id="itemForm">

                <label for="name">Food Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter food name"
                    required
                >

                <label for="price">Price (₹)</label>
                <input
                    type="number"
                    id="price"
                    placeholder="Enter price"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="available">Availability</label>
                <select id="available">
                    <option value="true">Available</option>
                    <option value="false">Not Available</option>
                </select>

                <button type="submit">Add Menu Item</button>

            </form>

            <p id="message"></p>
        </section>

    </main>

    <footer>
        <p>CS543 - Web Services | Assignment 8</p>
        <p>CampusEats REST API Project</p>
    </footer>

    <script>
        const menuList = document.getElementById('menuList');
        const itemForm = document.getElementById('itemForm');
        const message = document.getElementById('message');

        // Fetch and display all menu items
        async function loadItems() {
            try {
                const response = await fetch('/items');

                if (!response.ok) {
                    throw new Error('Unable to load menu');
                }

                const items = await response.json();

                menuList.innerHTML = '';

                if (items.length === 0) {
                    menuList.textContent = 'No menu items found.';
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-card';

                    const title = document.createElement('h3');
                    title.textContent = item.name;

                    const price = document.createElement('p');
                    price.textContent = `Price: ₹${item.price}`;

                    const availability = document.createElement('span');
                    availability.className = item.available
                        ? 'available'
                        : 'unavailable';

                    availability.textContent = item.available
                        ? 'Available'
                        : 'Not Available';

                    const id = document.createElement('small');
                    id.textContent = `Item ID: ${item.id}`;

                    card.append(title, price, availability, id);
                    menuList.appendChild(card);
                });

            } catch (error) {
                menuList.textContent = error.message;
            }
        }

        // Add a new menu item
        itemForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const newItem = {
                name: document.getElementById('name').value.trim(),
                price: Number(document.getElementById('price').value),
                available:
                    document.getElementById('available').value === 'true'
            };

            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newItem)
                });

                const result = await response.json();

                if (!response.ok) {
                    message.textContent = result.error;
                    message.style.color = 'red';
                    return;
                }

                message.textContent =
                    `Successfully added ${result.name}!`;
                message.style.color = 'green';

                itemForm.reset();

                // Refresh menu after successful POST
                await loadItems();

            } catch (error) {
                message.textContent = 'Error adding menu item.';
                message.style.color = 'red';
            }
        });

        // Load menu when page opens
        loadItems();
    </script>

</body>
</html>
